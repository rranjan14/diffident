[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for the gpui pin — every crate resolves the same revision.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
] }
diffident-model = { path = "crates/model" }
diffident-ui = { path = "crates/ui" }
diffident-diff = { path = "crates/diff" }
diffident-forge = { path = "crates/forge" }
diffident-highlight = { path = "crates/highlight" }

# default-features off: we do not want syntect's own theme/syntax dump loading,
# two-face supplies both. regex-fancy avoids the onig C dependency.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
    "parsing",
] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

# The binary. Owns nothing but startup and wiring.
[package]
name = "diffident"
version.workspace = true
edition.workspace = true

[dependencies]
diffident-model.workspace = true
diffident-ui.workspace = true
diffident-forge.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

[dev-dependencies]
diffident-diff.workspace = true
